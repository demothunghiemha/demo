<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <!-- Definitions for shadows and gradients -->
  <defs>
    <filter id="hubt-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Yellow Border -->
  <ellipse cx="300" cy="190" rx="280" ry="170" fill="#006b2b" stroke="#ffde00" stroke-width="12" filter="url(#hubt-glow)"/>
  <ellipse cx="300" cy="190" rx="268" ry="158" fill="none" stroke="#ffde00" stroke-width="3"/>

  <!-- Globe Grid Lines (Yellow) -->
  <!-- Equatorial line across -->
  <path d="M 32 190 L 568 190" stroke="#ffde00" stroke-width="6" fill="none"/>
  
  <!-- Central Meridian vertical -->
  <path d="M 300 22 L 300 358" stroke="#ffde00" stroke-width="6" fill="none"/>

  <!-- Upper latitude curve -->
  <path d="M 75 110 Q 300 165 525 110" stroke="#ffde00" stroke-width="5" fill="none"/>

  <!-- Lower latitude curve -->
  <path d="M 75 270 Q 300 215 525 270" stroke="#ffde00" stroke-width="5" fill="none"/>

  <!-- Meridian Curves -->
  <path d="M 300 22 Q 130 190 300 358" stroke="#ffde00" stroke-width="5" fill="none"/>
  <path d="M 300 22 Q 470 190 300 358" stroke="#ffde00" stroke-width="5" fill="none"/>

  <!-- LEFT SIDE: KHUE VAN CAC (TEMPLE OF LITERATURE) -->
  <g transform="translate(130, 95)" stroke="#ffde00" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top roof spire -->
    <path d="M 65 30 L 65 18" stroke-width="4.5"/>
    <circle cx="65" cy="16" r="3.5" fill="#ffde00"/>

    <!-- Upper roof 4 curved corners -->
    <path d="M 40 38 Q 65 33 90 38 L 96 34 Q 65 24 34 34 Z" fill="#ffde00" stroke-width="2"/>
    <!-- Upper eaves layer -->
    <rect x="44" y="38" width="42" height="12" fill="#006b2b" stroke-width="3.5"/>
    <line x1="51" y1="38" x2="51" y2="50" stroke-width="2.5"/>
    <line x1="58" y1="38" x2="58" y2="50" stroke-width="2.5"/>
    <line x1="65" y1="38" x2="65" y2="50" stroke-width="2.5"/>
    <line x1="72" y1="38" x2="72" y2="50" stroke-width="2.5"/>
    <line x1="79" y1="38" x2="79" y2="50" stroke-width="2.5"/>

    <!-- Main Roof Lower Tier with wide swooping corners -->
    <path d="M 22 66 Q 65 52 108 66 L 118 57 Q 65 42 12 57 Z" fill="#ffde00" stroke-width="2.5"/>
    
    <!-- Wooden brackets structure under roof -->
    <rect x="30" y="66" width="70" height="10" fill="#006b2b" stroke-width="3"/>
    <line x1="38" y1="66" x2="38" y2="76" stroke-width="2"/>
    <line x1="48" y1="66" x2="48" y2="76" stroke-width="2"/>
    <line x1="65" y1="66" x2="65" y2="76" stroke-width="2"/>
    <line x1="82" y1="66" x2="82" y2="76" stroke-width="2"/>
    <line x1="92" y1="66" x2="92" y2="76" stroke-width="2"/>

    <!-- Upper Pavilion Body with iconic Sun/Star Round Window -->
    <rect x="34" y="76" width="62" height="52" fill="#006b2b" stroke-width="4.5"/>
    <!-- Circular Window -->
    <circle cx="65" cy="102" r="16" stroke-width="4" fill="#006b2b"/>
    <circle cx="65" cy="102" r="11" stroke-width="2"/>
    <!-- Sunburst radiant wooden spokes around the window -->
    <line x1="65" y1="86" x2="65" y2="91" stroke-width="2.5"/>
    <line x1="65" y1="113" x2="65" y2="118" stroke-width="2.5"/>
    <line x1="49" y1="102" x2="54" y2="102" stroke-width="2.5"/>
    <line x1="76" y1="102" x2="81" y2="102" stroke-width="2.5"/>
    <line x1="53.7" y1="90.7" x2="57.2" y2="94.2" stroke-width="2.5"/>
    <line x1="72.8" y1="109.8" x2="76.3" y2="113.3" stroke-width="2.5"/>
    <line x1="76.3" y1="90.7" x2="72.8" y2="94.2" stroke-width="2.5"/>
    <line x1="57.2" y1="109.8" x2="53.7" y2="113.3" stroke-width="2.5"/>

    <!-- Railing line -->
    <line x1="28" y1="128" x2="102" y2="128" stroke-width="4.5"/>

    <!-- Lower Level: 4 Stone Pillars & Entrance Portal -->
    <!-- Left outer pillar -->
    <rect x="26" y="128" width="14" height="64" fill="#006b2b" stroke-width="4"/>
    <!-- Right outer pillar -->
    <rect x="90" y="128" width="14" height="64" fill="#006b2b" stroke-width="4"/>
    <!-- Inner Arch Beam -->
    <path d="M 40 142 L 90 142" stroke-width="4.5"/>
    <path d="M 40 192 L 40 142 L 90 142 L 90 192" stroke-width="4"/>
    <!-- Base step -->
    <line x1="20" y1="192" x2="110" y2="192" stroke-width="5"/>
  </g>

  <!-- RIGHT SIDE: TEXT -->
  <g fill="#ffde00" font-family="'Montserrat', 'Arial', sans-serif" font-weight="900" text-anchor="middle">
    <!-- ĐẠI HỌC KINH DOANH -->
    <text x="430" y="145" font-size="29" letter-spacing="2">ĐẠI HỌC</text>
    <text x="430" y="180" font-size="27" letter-spacing="2">KINH DOANH</text>

    <!-- VÀ CÔNG NGHỆ HÀ NỘI -->
    <text x="430" y="235" font-size="25" letter-spacing="1.5">VÀ CÔNG NGHỆ</text>
    <text x="430" y="270" font-size="28" letter-spacing="2">HÀ NỘI</text>
  </g>
</svg>
