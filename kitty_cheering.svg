<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <defs>
    <filter id="kitty-cheer-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="rgba(0,0,0,0.18)"/>
    </filter>
  </defs>

  <g id="kitty-cheering">
    <!-- Left Raised Arm -->
    <path d="M 52 140 Q 25 110 32 85 Q 48 80 58 110 Z" fill="#ffffff" stroke="#222" stroke-width="4.5" stroke-linejoin="round"/>
    <ellipse cx="36" cy="86" rx="10" ry="11" fill="#ffffff" stroke="#222" stroke-width="4"/>

    <!-- Right Raised Arm -->
    <path d="M 168 140 Q 195 110 188 85 Q 172 80 162 110 Z" fill="#ffffff" stroke="#222" stroke-width="4.5" stroke-linejoin="round"/>
    <ellipse cx="184" cy="86" rx="10" ry="11" fill="#ffffff" stroke="#222" stroke-width="4"/>

    <!-- Cute Body in Graduation Blue Gown -->
    <path d="M 68 142 Q 110 135 152 142 L 165 200 Q 110 208 55 200 Z" fill="#1e3a8a" stroke="#222" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Yellow Graduation Sash on Gown -->
    <path d="M 85 140 L 95 202 L 125 202 L 135 140" fill="#ffd700" stroke="#b45309" stroke-width="1.5"/>

    <!-- Feet -->
    <ellipse cx="85" cy="205" rx="16" ry="10" fill="#ffffff" stroke="#222" stroke-width="4"/>
    <ellipse cx="135" cy="205" rx="16" ry="10" fill="#ffffff" stroke="#222" stroke-width="4"/>

    <!-- Hello Kitty Head -->
    <ellipse cx="110" cy="85" rx="66" ry="50" fill="#ffffff" stroke="#222" stroke-width="4.5" filter="url(#kitty-cheer-shadow)"/>

    <!-- Left Ear -->
    <path d="M 58 55 Q 42 16 70 30 Z" fill="#ffffff" stroke="#222" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Right Ear -->
    <path d="M 162 55 Q 178 16 150 30 Z" fill="#ffffff" stroke="#222" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Graduation Cap on Kitty Head -->
    <g transform="translate(68, -4) rotate(-8)">
      <polygon points="42,0 84,18 42,36 0,18" fill="#1e293b" stroke="#d4af37" stroke-width="2.5"/>
      <polygon points="42,6 74,20 42,32 10,20" fill="#0f172a"/>
      <path d="M 22 26 L 22 40 Q 42 50 62 40 L 62 26 Z" fill="#0f172a" stroke="#d4af37" stroke-width="2"/>
      <circle cx="42" cy="18" r="4" fill="#ffd700"/>
      <path d="M 42 18 Q 20 30 16 46" stroke="#ffd700" stroke-width="2.5" fill="none"/>
      <circle cx="16" cy="48" r="3" fill="#ffd700"/>
    </g>

    <!-- Pink Bow on Right Ear -->
    <g transform="translate(146, 32) rotate(18)">
      <path d="M 0 0 C -18 -15 -25 12 0 4 Z" fill="#ff69b4" stroke="#222" stroke-width="3.5"/>
      <path d="M 0 0 C 18 -15 25 12 0 4 Z" fill="#ff69b4" stroke="#222" stroke-width="3.5"/>
      <circle cx="0" cy="2" r="7.5" fill="#ff1493" stroke="#222" stroke-width="3"/>
    </g>

    <!-- Joyful Eyes (Curved Happy Eyes ^_^) -->
    <path d="M 72 88 Q 80 80 88 88" stroke="#222" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 132 88 Q 140 80 148 88" stroke="#222" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Yellow Nose -->
    <ellipse cx="110" cy="98" rx="6.5" ry="4.5" fill="#facc15" stroke="#222" stroke-width="2.5"/>

    <!-- Rosy Blushing Cheeks -->
    <ellipse cx="62" cy="100" rx="10" ry="6" fill="#ffb6c1" opacity="0.85"/>
    <ellipse cx="158" cy="100" rx="10" ry="6" fill="#ffb6c1" opacity="0.85"/>

    <!-- Whiskers -->
    <line x1="48" y1="88" x2="24" y2="82" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="46" y1="98" x2="20" y2="98" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="48" y1="108" x2="24" y2="114" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>

    <line x1="172" y1="88" x2="196" y2="82" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="174" y1="98" x2="200" y2="98" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="172" y1="108" x2="196" y2="114" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Floating Mini Hearts above Raised Paws -->
    <path d="M 28 55 Q 33 45 40 50 Q 48 45 52 55 Q 40 70 40 70 Q 40 70 28 55 Z" fill="#ff4d88"/>
    <path d="M 172 55 Q 177 45 184 50 Q 192 45 196 55 Q 184 70 184 70 Q 184 70 172 55 Z" fill="#ff4d88"/>
  </g>
</svg>
